<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wohnungen 3D-Besichtigung</title>
<meta name="description" content="Digitale Besichtigung der Maisonette-Wohnungen 2 und 3 (OG + DG) im Holz-Neubau.">
<style>
:root{
  --bg:#f5f3ee; --panel:#ffffff; --text:#1f2328; --muted:#646a71; --line:#e3dfd6;
  --chip:#ece8df; --chip-text:#2a2e33; --accent:#2f6b4c; --accent-ink:#ffffff;
  --room:#faf7f0; --room-wet:#e9eef0; --balc:#f1e6d4; --wall:#2b2b2b; --win:#5a8fb0;
  --furn:#b9a68a; --hl:#2f6b4c; --sky:#dfeaf2; --label-bg:rgba(255,255,255,.92); --label-text:#1f2328;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181b; --panel:#1f2226; --text:#e8e6e1; --muted:#a2a7ad; --line:#30343a;
    --chip:#2a2e33; --chip-text:#e3e1dc; --accent:#5fae86; --accent-ink:#0f1a14;
    --room:#23272b; --room-wet:#1f2a30; --balc:#2e2a22; --wall:#e7e3dc; --win:#7fb5d6;
    --furn:#8f826d; --hl:#5fae86; --sky:#1b2229; --label-bg:rgba(31,34,38,.92); --label-text:#e8e6e1;
  }
}
:root[data-theme="dark"]{
  --bg:#16181b; --panel:#1f2226; --text:#e8e6e1; --muted:#a2a7ad; --line:#30343a;
  --chip:#2a2e33; --chip-text:#e3e1dc; --accent:#5fae86; --accent-ink:#0f1a14;
  --room:#23272b; --room-wet:#1f2a30; --balc:#2e2a22; --wall:#e7e3dc; --win:#7fb5d6;
  --furn:#8f826d; --hl:#5fae86; --sky:#1b2229; --label-bg:rgba(31,34,38,.92); --label-text:#e8e6e1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{padding:10px 16px 8px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:17px;margin:0 0 8px;font-weight:650;letter-spacing:.1px}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.grp>span{font-size:12px;color:var(--muted);margin-right:2px}
.chip{border:0;border-radius:999px;padding:6px 12px;background:var(--chip);color:var(--chip-text);font:inherit;font-size:14px;cursor:pointer;line-height:1.2}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:grid;grid-template-columns:1fr 360px;height:calc(100% - var(--hh,92px))}
#view{position:relative;overflow:hidden;background:var(--sky);min-height:300px}
#c{display:block;width:100%;height:100%;touch-action:none}
#plan{position:absolute;inset:0;display:none;background:var(--bg);overflow:auto}
#plan svg{display:block;width:100%;height:100%}
#labels{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-50%);background:var(--label-bg);color:var(--label-text);font-size:12px;padding:2px 7px;border-radius:6px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.lbl b{font-weight:600}
#hint{position:absolute;left:12px;bottom:12px;right:12px;font-size:12.5px;color:var(--label-text);pointer-events:none;display:flex;justify-content:flex-start}
#hint span{background:var(--label-bg);padding:5px 9px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.15);max-width:560px}
#walkbtns{position:absolute;right:12px;bottom:48px;display:none;flex-direction:column;gap:8px}
#walkbtns button{width:52px;height:52px;border-radius:50%;border:0;background:var(--label-bg);color:var(--label-text);font-size:22px;box-shadow:0 1px 4px rgba(0,0,0,.25);touch-action:none}
#mini{position:absolute;top:10px;right:10px;width:150px;display:none;background:var(--label-bg);border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.2);padding:4px}
#mini svg{display:block;width:100%;height:auto}
aside{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:14px 16px 24px}
aside h2{font-size:16px;margin:0 0 2px}
aside h3{font-size:13px;margin:16px 0 6px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.big{font-size:24px;font-weight:650;margin:6px 0 0}
.sub{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.room{cursor:pointer}
tr.room:hover td{background:var(--chip)}
tr.room td:first-child::after{content:" →";color:var(--muted);font-size:12px}
tr.sum td{font-weight:650;border-bottom:2px solid var(--line)}
.note{font-size:12.5px;color:var(--muted);margin:6px 0}
.note b{color:var(--text);font-weight:600}
ul.note{padding-left:18px}
@media (max-width:820px){
  main{display:block;height:auto}
  #view{height:62vh;height:62svh}
  aside{border-left:0;border-top:1px solid var(--line)}
  header{padding:8px 16px}
  header h1{font-size:14px;margin-bottom:6px}
  .bar{gap:6px 8px}
  .grp>span{display:none}
  body.v-plan #hint{display:none}
  .chip{padding:6px 10px;font-size:13.5px}
}

<script>

if(!window.THREE){document.getElementById('hintTxt').textContent='3D-Bibliothek konnte nicht geladen werden. Bitte Internetverbindung prüfen.';return;}

/* ================= Geometrie aus dem Werkplan (Meter) =================
   x: entlang Längsseite, 0 = Außenkante NW-Giebel
   y: entlang Giebel, 0 = Außenkante Gartenseite, 9,60 = Straßenseite
   z: Höhe, ±0 = FFB EG.   Wohnung 3 = Wohnung 2 gespiegelt (x' = 13,54 − x) */
const D2R=Math.PI/180, K=Math.tan(26*D2R);
const L=13.54, B=9.60, T=0.347, MID=L/2;
const Z_OG=2.78, Z_DG=5.54, H_OG=2.40, RIDGE=9.04, ROOF_T=0.68, YR=B/2;
const HR=RIDGE-ROOF_T-Z_DG;
const RT=0.36;                         // sichtbare Dachstärke außen (Ortgang/Traufe)            // lichte Firsthöhe DG ≈ 2,82
const CX0=3.455, CX1=L-CX0;            // Zwerchgiebel über Balkonen
const EAVE=1.40, GOV=1.00;             // Dachüberstand Traufe / Giebel (Giebel nach Foto geschätzt)
const LB_X0=3.55, LB_X1=12.6, LB_D=1.5;  // Laubengang Straßenseite (nach Fotos)
const BAL_D=2.55, BAL_S=0.98, SEP0=6.67, SEP1=6.87;
const RISE=(Z_DG-Z_OG)/15;
const zOut=y=>RIDGE-K*Math.abs(y-YR);
const zCross=x=>RIDGE-K*Math.abs(x-MID);
const inCross=x=>x>=CX0-1e-9&&x<=CX1+1e-9;
const hMain=y=>HR-K*Math.abs(y-YR);
const hCross=x=>inCross(x)?HR-K*Math.abs(x-MID):-9;
const hDG=(x,y)=>Math.max(hMain(y), y<=YR?hCross(x):-9);
const mx=x=>L-x;
const rect=(x0,y0,x1,y1)=>[[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
const STAIR_OPEN=[5.235,5.636,6.545,9.253];

const HEAD={cross:(x,y)=>hCross(x)-0.10, roof:(x,y)=>hMain(y)-0.15};

/* ---------- Wohnung 2 (NW-Hälfte) ---------- */
const W2={
  intWalls:[
    {lvl:'OG',r:[3.327,5.723,3.517,9.253],op:[{a:5.823,b:6.833,s:0,h:2.01,k:'door'}]},

    gardenDG:[{a:3.715,b:6.545,s:0,h:'cross',k:'gdoor'}],

    gableOG:[{a:1.778,b:2.793,s:0.87,h:2.135,k:'win'},{a:4.293,b:5.308,s:0.87,h:2.135,k:'win'},{a:6.808,b:7.823,s:0.87,h:2.135,k:'win'}],

  },
  rooms:[
    {id:'wohnen',lvl:'OG',name:'Wohnen / Essen / Kochen',poly:[[T,T],[6.545,T],[6.545,3.653],[5.205,3.653],[5.205,5.533],[T,5.533]],lab:[2.6,2.45],sp:[4.6,5.05],look:-115},
    {id:'abst',lvl:'OG',name:'Abstellraum',fs:0.17,poly:rect(5.395,3.843,6.545,5.533),lab:[5.97,4.4],sp:[4.75,4.6],look:0},

    {id:'balkonOG',lvl:'OG',name:'Balkon OG',f:0.25,poly:[[T,0],[SEP0,0],[SEP0,-BAL_D],[CX0,-BAL_D],[CX0,-BAL_S],[T,-BAL_S]],lab:[5.0,-1.5],sp:[4.6,-1.0],look:-90},
    {id:'schlafen',lvl:'DG',name:'Schlafzimmer',poly:[[T,T],[6.545,T],[6.545,5.283],[5.447,5.283],[5.447,4.913],[3.825,4.913],[3.825,5.103],[1.347,5.103],[1.347,4.705],[T,4.705]],lab:[1.5,2.2],sp:[4.65,3.6],look:-90},

    {id:'balkonDG',lvl:'DG',name:'Balkon DG',f:0.25,poly:rect(CX0,-BAL_D,SEP0,0),lab:[5.0,-1.4],sp:[5.3,-0.7],look:-90}
  ],
  /* Sanitär (fest, nach Fotos schematisch) */
  fixed:[
    {lvl:'OG',t:'tub',x:0.722,y:7.62,w:0.75,d:1.70,rot:0},
    {lvl:'OG',t:'shower',x:0.80,y:6.22,w:0.90,d:1.0,rot:0},
    {lvl:'OG',t:'wc',x:2.86,y:9.13,w:0.95,d:0.25,rot:0},
    {lvl:'OG',t:'basin',x:3.10,y:7.95,w:0.60,d:0.46,rot:90}
  ],
  /* Beispielmöblierung (nach Fotos der Nachbarwohnung) */
  furn:[
    {lvl:'OG',t:'sofa',x:2.25,y:3.45,w:2.1,d:0.92,rot:0,c:0x9fb3a2},
    {lvl:'OG',t:'sofa',x:0.82,y:2.35,w:1.6,d:0.92,rot:-90,c:0x9fb3a2},
    {lvl:'OG',t:'otable',x:2.25,y:4.45,w:1.0,d:0.55},
    {lvl:'OG',t:'tv',x:2.3,y:5.29,w:1.5,d:0.45,rot:180},
    {lvl:'OG',t:'cab',x:3.6,y:5.31,w:0.8,d:0.42,h:1.95,rot:180,c:0x5a3d2b},
    {lvl:'OG',t:'cab',x:2.62,y:0.6,w:1.5,d:0.5,h:2.0,rot:0,c:0x5a3d2b},
    {lvl:'OG',t:'dtable',x:4.3,y:2.2,w:0.95,d:1.8,rot:0},
    {lvl:'OG',t:'chair',x:3.62,y:1.65,rot:-90},{lvl:'OG',t:'chair',x:3.62,y:2.2,rot:-90},{lvl:'OG',t:'chair',x:3.62,y:2.75,rot:-90},
    {lvl:'OG',t:'chair',x:4.98,y:1.65,rot:90},{lvl:'OG',t:'chair',x:4.98,y:2.2,rot:90},{lvl:'OG',t:'chair',x:4.98,y:2.75,rot:90},
    {lvl:'OG',t:'kitchen',x:6.245,y:2.15,w:2.8,d:0.6,rot:90},
    {lvl:'OG',t:'cab',x:6.245,y:3.3,w:0.6,d:0.6,h:2.1,rot:90,c:0xe9e6df},
    {lvl:'OG',t:'cab',x:3.75,y:7.55,w:1.2,d:0.42,h:0.46,rot:-90,c:0xc49a6c},

    {lvl:'DG',t:'cab',x:3.6,y:4.86,w:0.4,d:0.4,h:0.5,rot:180,c:0xc49a6c},
    {lvl:'DG',t:'cab',x:6.245,y:2.6,w:2.0,d:0.6,h:2.05,rot:90,c:0xe9e6df},
    {lvl:'DG',t:'desk',x:0.72,y:5.9,w:1.4,d:0.7,rot:-90},
    {lvl:'DG',t:'chair',x:1.35,y:5.9,rot:90},

};

/* ---------- Treppe (viertelgewendelt unten und oben) ---------- */
function wedge(P,th1,th2,R){
  const [xa,ya,xb,yb]=R;
  const hit=th=>{const c=Math.cos(th*D2R),s=Math.sin(th*D2R);let t=1e9;
    if(c>1e-9)t=Math.min(t,(xb-P[0])/c); if(s>1e-9)t=Math.min(t,(yb-P[1])/s); if(s<-1e-9)t=Math.min(t,(ya-P[1])/s);
    return [P[0]+c*t,P[1]+s*t];};
  const corners=[[xb,yb],[xb,ya],[xa,ya],[xa,yb]].map(p=>({p,a:Math.atan2(p[1]-P[1],p[0]-P[0])/D2R}))
     .filter(o=>o.a<th1-1e-6&&o.a>th2+1e-6&&Math.hypot(o.p[0]-P[0],o.p[1]-P[1])>1e-6).sort((a,b)=>b.a-a.a).map(o=>o.p);
  return [P,hit(th1),...corners,hit(th2)];
}
function stairTreads(){
  const X0=5.235,X1=6.545,Pb=[X0,7.943],Pt=[X0,7.033],out=[];let j=1;
  for(let i=0;i<5;i++,j++) out.push({poly:wedge(Pb,90-18*i,90-18*(i+1),[X0,7.943,X1,9.253]),z:Z_OG+j*RISE});
  const g=(7.943-7.033)/4;
  for(let i=0;i<4;i++,j++) out.push({poly:rect(X0,7.943-(i+1)*g-0.02,X1,7.943-i*g),z:Z_OG+j*RISE});
  for(let i=0;i<5;i++,j++) out.push({poly:wedge(Pt,-18*i,-18*(i+1),[X0,5.723,X1,7.033]),z:Z_OG+j*RISE});
  return out;
}
W2.treads=stairTreads();

/* ---------- Spiegelung → Wohnung 3 ---------- */
const mPoly=p=>p.map(([x,y])=>[mx(x),y]).reverse();
const mRect=r=>[mx(r[2]),r[1],mx(r[0]),r[3]];
const mOpsX=ops=>ops.map(o=>Object.assign({},o,{a:mx(o.b),b:mx(o.a)}));
function axisOf(r){return (r[2]-r[0])>=(r[3]-r[1])?'x':'y';}
function mirrorUnit(u){
  return {
    intWalls:u.intWalls.map(w=>({lvl:w.lvl,r:mRect(w.r),op:w.op?(axisOf(w.r)==='x'?mOpsX(w.op):w.op.map(o=>Object.assign({},o))):undefined})),
    rooms:u.rooms.map(r=>Object.assign({},r,{poly:mPoly(r.poly),holes:r.holes&&r.holes.map(mPoly),excl:r.excl&&r.excl.map(mPoly),lab:[mx(r.lab[0]),r.lab[1]],sp:[mx(r.sp[0]),r.sp[1]],look:180-r.look})),
    fixed:u.fixed.map(f=>Object.assign({},f,{x:mx(f.x),rot:-(f.rot||0)})),
    furn:u.furn.map(f=>Object.assign({},f,{x:mx(f.x),rot:-(f.rot||0)})),
    treads:u.treads.map(t=>({poly:mPoly(t.poly),z:t.z}))
  };
}
const W3=mirrorUnit(W2);
const UNITS={2:W2,3:W3};
const UNIT_CX={2:(T+6.545)/2,3:mx((T+6.545)/2)};

/* ---------- Außenwände (ganzes Haus) ---------- */
function extWallSpecs(){
  const e=W2.ext, both=a=>[...a,...mOpsX(a)];
  const S=0.025, list=[];
  const add=(lvl,r,skin,z0,top,op)=>list.push({lvl,r,skin,z0,top,op,ext:true});

/* ---------- Geländer ---------- */
// boards: dicht gesetzte senkrechte Bretter (OG-Balkon, Laubengang) · lattice: Latten mit Abstand (DG) · steel: Treppe
const SLATS={};
const RK={boards:{w:0.10,d:0.024,sp:0.118,mat:'larch'},lattice:{w:0.045,d:0.045,sp:0.115,mat:'larch'},steel:{w:0.018,d:0.018,sp:0.12,mat:'steel'}};
function railing(grp,pts,z,h,kind,collide){
  kind=kind||'boards';const K_=RK[kind];const wood=K_.mat==='larch';
  const gname=Object.keys(G).find(k=>G[k]===grp);
  for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];
    beam(grp,[a[0],a[1],z+h],[b[0],b[1],z+h],wood?0.12:0.06,wood?0.06:0.05,wood?M.larch:M.tread);
    if(wood)beam(grp,[a[0],a[1],z+0.1],[b[0],b[1],z+0.1],0.06,0.05,M.larch);
    if(kind==='lattice')beam(grp,[a[0],a[1],z+h-0.16],[b[0],b[1],z+h-0.16],0.06,0.05,M.larch);
    const len=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.round(len/K_.sp)),ang=Math.atan2(b[1]-a[1],b[0]-a[0]);
    const key=kind+'|'+gname;(SLATS[key]=SLATS[key]||[]);
    for(let k=0;k<=n;k++){const t=k/n;SLATS[key].push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,z,h,ang]);}
    if(collide){const pad=0.04;COLL.push({x0:Math.min(a[0],b[0])-pad,x1:Math.max(a[0],b[0])+pad,y0:Math.min(a[1],b[1])-pad,y1:Math.max(a[1],b[1])+pad,z0:z,z1:z+h});}
  }
}
function flushSlats(){
  Object.keys(SLATS).forEach(key=>{const [kind,gname]=key.split('|');const K_=RK[kind],arr=SLATS[key];
    const im=new THREE.InstancedMesh(BOXG,K_.mat==='larch'?M.larch:M.steel,arr.length);const m=new THREE.Matrix4(),q=new THREE.Quaternion(),s=new THREE.Vector3(),Y=new THREE.Vector3(0,1,0);
    arr.forEach((a,i)=>{s.set(K_.w,a[3],K_.d);q.setFromAxisAngle(Y,a[4]);m.compose(P(a[0],a[1],a[2]+a[3]/2),q,s);im.setMatrixAt(i,m);});
    im.castShadow=true;im.receiveShadow=true;G[gname].add(im);});
}

const FM={};

  else if(state.view==='puppe'){camera.fov=45;const sgn=state.unit===2?-1:1,k=camera.aspect<1?Math.pow(1/camera.aspect,0.75):1;controls.target.copy(P(cx,4.4,zl+0.8));camera.position.copy(P(cx+sgn*5.5*k,4.4-10.9*k,zl+0.8+10.7*k));}

}

/* ---------- Rundgang (Ich-Perspektive) ---------- */
const player={x:3,y:1.5,feet:Z_OG,yaw:0,pitch:-0.05,eye:1.6,target:null,stuck:0};
const keys=new Set();
const R_PL=0.22;
function surfContains(s,x,y){if(!pip(x,y,s.poly))return false;for(const h of (s.holes||[]))if(pip(x,y,h))return false;return true;}
function groundAt(x,y,zRef){let best=-Infinity;for(const s of SURF){if(s.z<=zRef+0.42&&s.z>best&&surfContains(s,x,y))best=s.z;}return best;}
function headBlocked(x,y,g){for(const s of SURF){if(s.z>g+0.42&&s.z<g+1.85&&surfContains(s,x,y))return true;}return false;}
function inStairOpen(x,y){const a=STAIR_OPEN,b=mRect(STAIR_OPEN);return (x>=a[0]&&x<=a[2]&&y>=a[1]&&y<=a[3])||(x>=b[0]&&x<=b[2]&&y>=b[1]&&y<=b[3]);}
function ceilAt(x,y,feet){
  if(feet>Z_DG-0.4){if(y<0)return inCross(x)?zCross(x)-RT-0.15:99;return Z_DG+hDG(x,y);}
  if(y<0)return y<-BAL_S&&!inCross(x)?99:Z_DG-0.27;
  if(inStairOpen(x,y))return Z_DG+hDG(x,y);
  return Z_OG+H_OG;
}
function collides(x,y,g){const lo=g+0.3,hi=g+1.25;for(const c of COLL){if(c.off||c.z1<lo||c.z0>hi)continue;
  const nx=Math.max(c.x0,Math.min(x,c.x1)),ny=Math.max(c.y0,Math.min(y,c.y1));if((nx-x)*(nx-x)+(ny-y)*(ny-y)<R_PL*R_PL)return true;}return false;}
function canStand(x,y,zRef){const g=groundAt(x,y,zRef);if(g===-Infinity)return null;if(headBlocked(x,y,g))return null;if(ceilAt(x,y,g)-g<1.2)return null;if(collides(x,y,g))return null;return g;}
function tryMove(dx,dy){
  const z=player.feet;let g=canStand(player.x+dx,player.y+dy,z);
  if(g!==null){player.x+=dx;player.y+=dy;player.gTarget=g;return true;}
  g=canStand(player.x+dx,player.y,z);if(g!==null&&Math.abs(dx)>1e-5){player.x+=dx;player.gTarget=g;return 'slide';}
  g=canStand(player.x,player.y+dy,z);if(g!==null&&Math.abs(dy)>1e-5){player.y+=dy;player.gTarget=g;return 'slide';}
  return false;
}
function placePlayer(x,y,lvl,look){
  player.x=x;player.y=y;player.feet=player.gTarget=groundAt(x,y,lvl==='OG'?Z_OG+0.1:Z_DG+0.1);
  if(player.feet===-Infinity)player.feet=player.gTarget=lvl==='OG'?Z_OG:Z_DG;
  player.yaw=(look||0)*D2R;player.pitch=-0.08;player.target=null;updateEye(1);
}
function updateEye(k){const c=ceilAt(player.x,player.y,player.feet)-player.feet;const want=Math.max(1.05,Math.min(1.6,c-0.14));player.eye+= (want-player.eye)*k;}
function applyWalkCam(){
  const e=P(player.x,player.y,player.feet+player.eye);camera.position.copy(e);
  const d=new THREE.Vector3(Math.cos(player.yaw)*Math.cos(player.pitch),Math.sin(player.pitch),-Math.sin(player.yaw)*Math.cos(player.pitch));
  camera.lookAt(e.clone().add(d));
}
function walkStep(dt){
  let moving=false;const sp=(keys.has('shift')?3.0:1.5)*dt;
  let f=0,s=0,turn=0;
  if(keys.has('w')||keys.has('arrowup')||keys.has('bF'))f+=1;
  if(keys.has('s')||keys.has('arrowdown')||keys.has('bB'))f-=1;
  if(keys.has('a'))s+=1; if(keys.has('d'))s-=1;
  if(keys.has('arrowleft')||keys.has('q'))turn+=1; if(keys.has('arrowright')||keys.has('e'))turn-=1;
  if(turn){player.yaw+=turn*1.6*dt;moving=true;}
  if(f||s){player.target=null;const cy=Math.cos(player.yaw),sy=Math.sin(player.yaw);
    const n=Math.hypot(f,s);tryMove((cy*f-sy*s)/n*sp,(sy*f+cy*s)/n*sp);moving=true;}
  if(player.target){
    const tx=player.target[0]-player.x,ty=player.target[1]-player.y,dist=Math.hypot(tx,ty);
    if(dist<0.08){player.target=null;}
    else{const want=Math.atan2(ty,tx);let da=want-player.yaw;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;
      player.yaw+=da*Math.min(1,dt*5);
      const st=Math.min(dist,sp);const r=tryMove(tx/dist*st,ty/dist*st);
      if(r!==true){player.stuck+=dt;if(player.stuck>0.35){player.target=null;player.stuck=0;}}else player.stuck=0;
      moving=true;}
  }
  if(player.gTarget!==undefined&&Math.abs(player.gTarget-player.feet)>0.002){player.feet+=(player.gTarget-player.feet)*Math.min(1,dt*10);moving=true;}
  updateEye(Math.min(1,dt*8));
  const nl=player.feet>Z_OG+1.5?'DG':'OG';
  if(nl!==state.lvl){state.lvl=nl;syncChips();renderPanel();}
  applyWalkCam();
  return moving;
}

/* ---------- Eingaben ---------- */
let pdown=null;
canvas.addEventListener('pointerdown',e=>{if(state.view!=='walk')return;pdown={x:e.clientX,y:e.clientY,t:performance.now(),moved:0,id:e.pointerId};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(state.view!=='walk'||!pdown||e.pointerId!==pdown.id)return;const dx=e.clientX-pdown.x,dy=e.clientY-pdown.y;pdown.moved+=Math.abs(dx)+Math.abs(dy);pdown.x=e.clientX;pdown.y=e.clientY;
  const k=e.pointerType==='touch'?0.006:0.004;player.yaw+=dx*k;player.pitch=Math.max(-1.25,Math.min(1.25,player.pitch-dy*k));applyWalkCam();requestRender();});
canvas.addEventListener('pointerup',e=>{if(state.view!=='walk'||!pdown)return;const tap=pdown.moved<8&&performance.now()-pdown.t<450;pdown=null;
  if(tap)tapGo(e);});
const ray=new THREE.Raycaster();
function tapGo(e){
  const rc=canvas.getBoundingClientRect();const v=new THREE.Vector2(((e.clientX-rc.left)/rc.width)*2-1,-((e.clientY-rc.top)/rc.height)*2+1);
  ray.setFromCamera(v,camera);
  const hits=ray.intersectObjects(scene.children,true).filter(h=>h.object.visible&&h.object.material!==M.glass&&h.object.material!==M.glassShower);
  if(!hits.length)return;
  const h=hits[0];if(PICK.indexOf(h.object)<0&&!(h.face&&h.face.normal&&Math.abs(h.face.normal.clone().transformDirection(h.object.matrixWorld).y)>0.9))return;
  const tx=h.point.x,ty=-h.point.z,tz=h.point.y;
  if(Math.abs(tz-player.feet)>0.6){const g=canStand(tx,ty,tz);if(g!==null){player.x=tx;player.y=ty;player.feet=player.gTarget=g;updateEye(1);}}
  else player.target=[tx,ty];
  requestRender();
}
const keyName=e=>e.key.length===1?e.key.toLowerCase():e.key.toLowerCase();
window.addEventListener('keydown',e=>{if(state.view!=='walk')return;const k=keyName(e);if(['w','a','s','d','q','e','arrowup','arrowdown','arrowleft','arrowright','shift'].includes(k)){keys.add(k);e.preventDefault();requestRender();}});
window.addEventListener('keyup',e=>{keys.delete(keyName(e));});
window.addEventListener('blur',()=>keys.clear());
[['bF','bF'],['bB','bB']].forEach(([id,k])=>{const b=document.getElementById(id);
  b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(k);requestRender();});
  ['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>keys.delete(k)));});

/* ---------- Render-Schleife (nur bei Bedarf) ---------- */
let pending=false,lastT=0;
function requestRender(){if(!pending){pending=true;requestAnimationFrame(frame);}}
function frame(t){
  pending=false;const dt=Math.min(0.05,lastT?(t-lastT)/1000:0.016);lastT=t;
  let again=false;
  if(state.view==='walk')again=walkStep(dt);
  renderer.render(scene,camera);updateLabels();if(state.view==='walk')drawMini();
  if(again||keys.size)requestRender();else lastT=0;
}

  const v=document.getElementById('view');const w=v.clientWidth,h=v.clientHeight;

/* ================= 2D-Grundriss (SVG) ================= */
const svgY=y=>B-y;
const ptsAttr=poly=>poly.map(([x,y])=>x.toFixed(3)+','+svgY(y).toFixed(3)).join(' ');
const pathD=(poly)=>'M'+poly.map(([x,y])=>x.toFixed(3)+' '+svgY(y).toFixed(3)).join('L')+'Z';
function wallPieces(w){
  const r=w.r,ax=axisOf(r),u0=ax==='x'?r[0]:r[1],u1=ax==='x'?r[2]:r[3];
  const ops=(w.op||[]).slice().sort((a,b)=>a.a-b.a);const segs=[];let cur=u0;ops.forEach(o=>{segs.push([cur,o.a]);cur=o.b;});segs.push([cur,u1]);
  const R=(a,b)=>ax==='x'?[a,r[1],b,r[3]]:[r[0],a,r[2],b];
  return {solid:segs.filter(s=>s[1]-s[0]>0.003).map(s=>R(...s)),ops:ops.map(o=>({o,r:R(o.a,o.b),ax}))};
}
function planSVG(unit,lvl,furn,mini){
  const u=UNITS[unit];
  const clipX=unit===2?[-1.2,6.995]:[6.545,L+1.2];
  const vb=[clipX[0]-0.3,-2.1,clipX[1]-clipX[0]+0.6,B+BAL_D+3.4];
  let s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="'+vb.join(' ')+'" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Grundriss Wohnung '+unit+' '+lvl+'">';
  s+='<defs><clipPath id="cp'+(mini?'m':'')+'"><rect x="'+clipX[0]+'" y="-3" width="'+(clipX[1]-clipX[0])+'" height="20"/></clipPath></defs>';
  s+='<g clip-path="url(#cp'+(mini?'m':'')+')" font-family="system-ui,sans-serif">';
  // Balkon
  const bal=u.rooms.find(r=>r.id===(lvl==='OG'?'balkonOG':'balkonDG'));
  s+='<path d="'+pathD(bal.poly)+'" fill="var(--balc)" stroke="var(--muted)" stroke-width="0.03"/>';
  if(lvl==='DG'){const roofLn=[[unit===2?-0.3:MID,-BAL_D-0.3],[unit===2?MID:L+0.3,-BAL_D-0.3]];s+='<polyline points="'+ptsAttr(roofLn)+'" stroke="var(--muted)" stroke-width="0.02" stroke-dasharray="0.15 0.1" fill="none"/>';}
  if(lvl==='OG'){s+='<polygon points="'+ptsAttr(rect(LB_X0,B,LB_X1,B+LB_D))+'" fill="var(--balc)" stroke="var(--muted)" stroke-width="0.03"/>';
    for(let k=0;k<15;k++){const x=LB_X0-k*0.25;s+='<line x1="'+x+'" x2="'+x+'" y1="'+svgY(B+LB_D-1.0)+'" y2="'+svgY(B+LB_D)+'" stroke="var(--muted)" stroke-width="0.015"/>';}
    s+='<polyline points="'+ptsAttr([[LB_X0-3.5,B+LB_D-1.0],[LB_X0,B+LB_D-1.0],[LB_X0,B],[LB_X0,B+LB_D],[LB_X0-3.5,B+LB_D]])+'" fill="none" stroke="var(--muted)" stroke-width="0.02"/>';}
  // Räume
  u.rooms.filter(r=>r.lvl===lvl&&!r.f).forEach(r=>{let d=pathD(r.poly);(r.holes||[]).forEach(h=>d+=pathD(h));
    s+='<path d="'+d+'" fill-rule="evenodd" fill="'+(r.id==='bad'?'var(--room-wet)':'var(--room)')+'"/>';});
  // Treppe
  const tr=u.treads;
  if(lvl==='OG'){tr.forEach(t=>s+='<polygon points="'+ptsAttr(t.poly)+'" fill="none" stroke="var(--muted)" stroke-width="0.015"/>');}
  else{const op=unit===2?STAIR_OPEN:mRect(STAIR_OPEN);s+='<polygon points="'+ptsAttr(rect(...op))+'" fill="var(--bg)" stroke="var(--muted)" stroke-width="0.02" stroke-dasharray="0.08 0.06"/>';
    tr.forEach(t=>s+='<polygon points="'+ptsAttr(t.poly)+'" fill="none" stroke="var(--muted)" stroke-width="0.01" opacity="0.6"/>');}
  // Höhenlinien DG
  if(lvl==='DG'){
    const m=unit===2?(p=>p):(p=>mPoly(p).reverse());
    const y2=YR-(HR-2)/K,y1=YR-(HR-1)/K, x2=MID-(HR-2)/K;
    const lines=[[[T,y2],[x2,y2],[x2,T],'2,0 m'],[[T,y1],[CX0,y1],[CX0,T],'1,0 m'],[[T,B-y2],[6.545,B-y2],null,'2,0 m'],[[T,B-y1],[3.825,B-y1],null,'1,0 m']];
    lines.forEach(l=>{const pts=m(l.slice(0,3).filter(Boolean));s+='<polyline points="'+ptsAttr(pts)+'" fill="none" stroke="var(--hl)" stroke-width="0.025" stroke-dasharray="0.18 0.1"/>';
      const p0=pts[0];s+='<text x="'+(p0[0]+(unit===2?0.08:-0.08))+'" y="'+(svgY(p0[1])-0.07)+'" font-size="0.2" fill="var(--hl)" text-anchor="'+(unit===2?'start':'end')+'">'+l[3]+'</text>';});
  }
  // Möbel
  const fl=(furn?u.furn:[]).concat(u.fixed).filter(f=>f.lvl===lvl);
  fl.forEach(f=>{const w=f.w||0.5,d=f.d||0.5;s+='<rect x="'+(-w/2)+'" y="'+(-d/2)+'" width="'+w+'" height="'+d+'" rx="0.04" transform="translate('+f.x+' '+svgY(f.y)+') rotate('+(-(f.rot||0))+')" fill="none" stroke="var(--furn)" stroke-width="0.025"/>';});
  // Geländer
  if(lvl==='OG'){s+='<polyline points="'+ptsAttr([[T,0],[T,-BAL_S],[CX0,-BAL_S],[CX0,-BAL_D],[CX1,-BAL_D],[CX1,-BAL_S],[L-T,-BAL_S],[L-T,0]])+'" fill="none" stroke="var(--wall)" stroke-width="0.05"/>';
    s+='<rect x="'+SEP0+'" y="'+svgY(0)+'" width="'+(SEP1-SEP0)+'" height="'+BAL_D+'" fill="var(--wall)"/>';}
  else{s+='<polyline points="'+ptsAttr([[CX0,0],[CX0,-BAL_D],[CX1,-BAL_D],[CX1,0]])+'" fill="none" stroke="var(--wall)" stroke-width="0.05"/>';
    s+='<rect x="'+SEP0+'" y="'+svgY(0)+'" width="'+(SEP1-SEP0)+'" height="'+BAL_D+'" fill="var(--wall)"/>';}

    if(lvl==='OG'){const hx=unit===2?5.3:mx(4.17);s+='<text x="'+hx+'" y="'+(svgY(B+LB_D/2)+0.08)+'" font-size="0.22" fill="var(--muted)" text-anchor="middle">Laubengang</text>';
      if(unit===2)s+='<text x="'+(LB_X0-1.75)+'" y="'+(svgY(B+LB_D-0.5)+0.07)+'" font-size="0.18" fill="var(--muted)" text-anchor="middle">Außentreppe ↓</text>';}
  }

       '<text x="'+(nx*0.5)+'" y="'+(-ny*0.5+0.07)+'" font-size="0.2" text-anchor="middle" fill="var(--text)">N</text></g>';

    s+='<g><rect x="'+sx+'" y="'+sy+'" width="1" height="0.07" fill="var(--text)"/><rect x="'+(sx+1)+'" y="'+sy+'" width="1" height="0.07" fill="none" stroke="var(--text)" stroke-width="0.02"/>'+
       '<text x="'+sx+'" y="'+(sy+0.3)+'" font-size="0.18" fill="var(--muted)">0</text><text x="'+(sx+2)+'" y="'+(sy+0.3)+'" font-size="0.18" fill="var(--muted)" text-anchor="end">2 m</text></g>';
  } else {
    const pp=P(player.x,player.y,0);

   '<p class="note">Tippe auf einen Raum, um im Rundgang dorthin zu gehen.</p>'+
   '<h3>Bedienung</h3>'+
   '<ul class="note"><li><b>Puppenhaus / Außen:</b> ziehen = drehen, zwei Finger oder Mausrad = zoomen, rechte Maustaste = verschieben.</li>'+
   '<li><b>Rundgang am Handy:</b> wischen = umsehen, auf den Boden tippen = hingehen, ▲▼ = gehen. Über die Treppe geht es ins DG.</li>'+
   '<li><b>Rundgang am Computer:</b> W A S D oder Pfeiltasten, Maus ziehen = umsehen, Umschalt = schneller.</li></ul>'+
   '<h3>Hinweise</h3>'+
   '<ul class="note"><li>Maße aus dem Werkplan der Zimmerei (Stand 08/2025). Kleinere Abweichungen zur Ausführung sind möglich.</li>'+
   '<li><b>Wohnfläche nach WoFlV:</b> lichte Höhe ab 2 m voll, 1 bis 2 m zur Hälfte, unter 1 m nicht; Balkone zu einem Viertel; Treppe nicht angerechnet. Rechnerischer Wert ohne Gewähr.</li>'+
   '<li>Die Möblierung ist ein <b>Beispiel</b> und lässt sich oben ausblenden. Die Bad-Ausstattung ist schematisch nach Fotos dargestellt.</li>'+
   '<li>Das Erdgeschoss (Wohnung 1) ist nicht Teil der Besichtigung und nur als Hülle gezeigt. Fenster im EG schematisch. Laubengang und Außentreppe an der Straßenseite nach Fotos.</li></ul>';
  panel.querySelectorAll('tr.room').forEach(tr=>tr.addEventListener('click',()=>{const r=u.rooms.find(x=>x.id===tr.dataset.room);
    state.lvl=r.lvl;setView('walk',true);placePlayer(r.sp[0],r.sp[1],r.lvl,r.look);syncChips();applyVisibility();requestRender();
    if(window.innerWidth<=820)document.getElementById('view').scrollIntoView({behavior:'smooth'});}));
}
const HINTS={aussen:'Ziehen = drehen · Zoomen mit zwei Fingern oder Mausrad',
  puppe:'Blick von oben in die Räume · Etage oben wählen · ziehen = drehen',
  walk:'Wischen = umsehen · auf den Boden tippen = hingehen · am Computer W A S D',
  plan:'Grundriss mit Wohnflächen nach WoFlV · gestrichelt: lichte Höhe 1 m und 2 m'};
function syncChips(){
  document.querySelectorAll('.chip[data-k]').forEach(b=>b.setAttribute('aria-pressed',String(String(state[b.dataset.k])===b.dataset.v)));
  document.getElementById('furnBtn').setAttribute('aria-pressed',String(state.furn));
  document.getElementById('hintTxt').textContent=HINTS[state.view];
}
function setView(v,keepPlayer){
  state.view=v;document.body.className='v-'+v;
  const planEl=document.getElementById('plan');
  planEl.style.display=v==='plan'?'block':'none';
  canvas.style.visibility=v==='plan'?'hidden':'visible';
  controls.enabled=(v==='aussen'||v==='puppe');
  document.getElementById('walkbtns').style.display=v==='walk'?'flex':'none';
  miniBox.style.display=v==='walk'?'block':'none';
  if(v==='walk'){camera.fov=70;camera.updateProjectionMatrix();
    if(!keepPlayer){const r=UNITS[state.unit].rooms.find(x=>x.id===(state.lvl==='OG'?'wohnen':'galerie'));placePlayer(r.sp[0],r.sp[1],state.lvl,r.look);}
    applyWalkCam();}
  else if(v!=='plan')setCameraFor();
  if(v==='plan')planEl.innerHTML=planSVG(state.unit,state.lvl,state.furn,false);
  lblBox.innerHTML='';
  applyVisibility();syncChips();requestRender();
}
document.querySelectorAll('.chip[data-k]').forEach(b=>b.addEventListener('click',()=>{
  const k=b.dataset.k,v=b.dataset.v;
  if(k==='view'){setView(v);return;}
  state[k]=k==='unit'?+v:v;
  if(k==='unit')renderPanel();
  if(state.view==='walk'){const r=UNITS[state.unit].rooms.find(x=>x.id===(state.lvl==='OG'?'wohnen':'galerie'));placePlayer(r.sp[0],r.sp[1],state.lvl,r.look);applyWalkCam();}
  setView(state.view,true);
}));
document.getElementById('furnBtn').addEventListener('click',()=>{state.furn=!state.furn;setView(state.view,true);});

/* Start */
renderPanel();resize();setView('puppe');resize();
window.__tour={cam:camera,ctl:controls,state,player,setView,placePlayer,UNITS,canStand,groundAt,requestRender,keys,tryMove};
})();
</script>
