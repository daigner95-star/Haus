<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Holzhaus mit Garten</title>
<meta name="description" content="3D-Modell des Holzhauses: Wohnung 1 im Erdgeschoss mit Einbau-Projekten, Maisonette-Wohnungen 2 und 3 (OG + DG).">
<style>
:root{
  --bg:#f5f3ee; --panel:#ffffff; --text:#1f2328; --muted:#646a71; --line:#e3dfd6;
  --chip:#ece8df; --chip-text:#2a2e33; --accent:#2f6b4c; --accent-ink:#ffffff;
  --room:#faf7f0; --room-wet:#e9eef0; --balc:#f1e6d4; --wall:#2b2b2b; --win:#5a8fb0;
  --furn:#b9a68a; --hl:#2f6b4c; --sky:#dfeaf2; --label-bg:rgba(255,255,255,.92); --label-text:#1f2328; --warn:#b3461f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181b; --panel:#1f2226; --text:#e8e6e1; --muted:#a2a7ad; --line:#30343a;
    --chip:#2a2e33; --chip-text:#e3e1dc; --accent:#5fae86; --accent-ink:#0f1a14;
    --room:#23272b; --room-wet:#1f2a30; --balc:#2e2a22; --wall:#e7e3dc; --win:#7fb5d6;
    --furn:#8f826d; --hl:#5fae86; --sky:#1b2229; --label-bg:rgba(31,34,38,.92); --label-text:#e8e6e1; --warn:#e2876a;
  }
}
:root[data-theme="dark"]{
  --bg:#16181b; --panel:#1f2226; --text:#e8e6e1; --muted:#a2a7ad; --line:#30343a;
  --chip:#2a2e33; --chip-text:#e3e1dc; --accent:#5fae86; --accent-ink:#0f1a14;
  --room:#23272b; --room-wet:#1f2a30; --balc:#2e2a22; --wall:#e7e3dc; --win:#7fb5d6;
  --furn:#8f826d; --hl:#5fae86; --sky:#1b2229; --label-bg:rgba(31,34,38,.92); --label-text:#e8e6e1; --warn:#e2876a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{padding:10px 16px 8px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:17px;margin:0 0 8px;font-weight:650;letter-spacing:.1px}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.grp>span{font-size:12px;color:var(--muted);margin-right:2px}
.chip{border:0;border-radius:999px;padding:6px 12px;background:var(--chip);color:var(--chip-text);font:inherit;font-size:14px;cursor:pointer;line-height:1.2}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:grid;grid-template-columns:1fr 360px;height:calc(100% - var(--hh,92px))}
#view{position:relative;overflow:hidden;background:var(--sky);min-height:300px}
#c{display:block;width:100%;height:100%;touch-action:none}
#plan{position:absolute;inset:0;display:none;background:var(--bg);overflow:auto}
#plan svg{display:block;width:100%;height:100%}
#labels{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-50%);background:var(--label-bg);color:var(--label-text);font-size:12px;padding:2px 7px;border-radius:6px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.lbl b{font-weight:600}
#hint{position:absolute;left:12px;bottom:12px;right:12px;font-size:12.5px;color:var(--label-text);pointer-events:none;display:flex;justify-content:flex-start}
#hint span{background:var(--label-bg);padding:5px 9px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.15);max-width:560px}
#walkbtns{position:absolute;right:12px;bottom:48px;display:none;flex-direction:column;gap:8px}
#walkbtns button{width:52px;height:52px;border-radius:50%;border:0;background:var(--label-bg);color:var(--label-text);font-size:22px;box-shadow:0 1px 4px rgba(0,0,0,.25);touch-action:none}
#mini{position:absolute;top:10px;right:10px;width:150px;display:none;background:var(--label-bg);border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.2);padding:4px}
#mini svg{display:block;width:100%;height:auto}
aside{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:14px 16px 24px}
aside h2{font-size:16px;margin:0 0 2px}
aside h3{font-size:13px;margin:16px 0 6px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.big{font-size:24px;font-weight:650;margin:6px 0 0}
.sub{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.room{cursor:pointer}
tr.room:hover td{background:var(--chip)}
tr.room td:first-child::after{content:" →";color:var(--muted);font-size:12px}
tr.sum td{font-weight:650;border-bottom:2px solid var(--line)}
.note{font-size:12.5px;color:var(--muted);margin:6px 0}
.note b{color:var(--text);font-weight:600}
ul.note{padding-left:18px}
.sl{margin:9px 0}
.sl .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sl label{font-size:13.5px}
.sl input[type=number]{width:5.4em;font:inherit;font-size:13.5px;text-align:right;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 4px}
.sl input[type=range]{width:100%;accent-color:var(--accent);margin:4px 0 0}
.sl small{display:block;color:var(--muted);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.warn{color:var(--warn)} .ok{color:var(--accent)}
table.res td:last-child{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;padding-left:10px}
aside h4{font-size:14px;margin:14px 0 4px}
@media (max-width:820px){
  main{display:block;height:auto}
  #view{height:62vh;height:62svh}
  aside{border-left:0;border-top:1px solid var(--line)}
  header{padding:8px 16px}
  header h1{font-size:14px;margin-bottom:6px}
  .bar{gap:6px 8px}
  .grp>span{display:none}
  body.v-plan #hint{display:none}
  .chip{padding:6px 10px;font-size:13.5px}
}

/* ---------- Garten: rechte Leiste (.garden) und Einblendungen über der Szene (.gv) ---------- */
.garden,.gv{--surface:var(--panel);--surface-2:var(--chip);--fg:var(--text);--ok:#2c7843;--warn:#a8701a;--bad:#b23f2c;--scrim:var(--label-bg);--r:10px;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .garden,:root:not([data-theme="light"]) .gv{--ok:#5fbe7c;--warn:#e2aa4c;--bad:#e57560}}
:root[data-theme="dark"] .garden,:root[data-theme="dark"] .gv{--ok:#5fbe7c;--warn:#e2aa4c;--bad:#e57560}
aside.g{padding:0}
.garden{font-size:15px}
.garden .gtitle{font-size:16px;margin:0;padding:14px 16px 0}
.garden .gctl{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end;padding:10px 16px 12px}
.garden .ctl{display:flex;flex-direction:column;gap:2px;min-width:0}
.garden .ctl:first-child{flex:1 1 100%}
.garden .ctl label,.garden .glbl,.gv .glbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.garden select,.garden input[type="number"]{font:inherit;font-size:14px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:34px;max-width:100%}
.garden .ctl:first-child select{width:100%}
.garden button{font:inherit;color:inherit}
.garden .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.garden .seg button{border:0;background:transparent;padding:6px 12px;min-height:34px;cursor:pointer}
.garden .seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.garden .tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);border-top:1px solid var(--line);overflow-x:auto;position:sticky;top:0;background:var(--panel);z-index:3}
.garden .tabs button{border:0;background:transparent;padding:9px 10px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.garden .tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.garden .tabpane{padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px}
.garden .tabpane[hidden]{display:none}
.garden h2{font-size:16px;margin:0}
.garden h3{font-size:14px;margin:0;font-weight:700;color:var(--text);text-transform:none;letter-spacing:0}
.garden p{margin:0}
.garden .muted{color:var(--muted)} .garden .small{font-size:13px}
.garden .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.garden .pill.ok{color:var(--ok)} .garden .pill.warn{color:var(--warn)} .garden .pill.bad{color:var(--bad)}
.garden .vdesc{display:flex;flex-direction:column;gap:6px}
.garden .wins{display:flex;flex-direction:column;gap:8px}
.garden .win{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);cursor:pointer;width:100%}
.garden .win[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.garden .win .t{font-weight:700} .garden .win .r{font-size:12.5px;color:var(--muted)}
.garden .bars{grid-column:1/-1;display:grid;grid-template-columns:56px minmax(0,1fr) 42px;gap:3px 8px;align-items:center;font-size:12.5px}
.garden .track{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.garden .fill{height:100%;border-radius:4px;transition:width .3s}
.garden .num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:12.5px}
.garden .dgrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;font-size:13px;color:var(--muted);padding:2px}
.garden .plist{display:flex;flex-direction:column;gap:6px}
.garden .prow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);cursor:pointer;text-align:left;width:100%}
.garden .prow[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.garden .badge{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--fg);color:var(--bg);font-weight:700;font-size:12.5px;font-family:var(--font-mono)}
.garden .prow .meta{font-size:12.5px;color:var(--muted);font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.garden .editor{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.garden .editor .full{grid-column:1/-1}
.garden .field{display:flex;flex-direction:column;gap:3px;min-width:0}
.garden .field input[type="range"]{width:100%;accent-color:var(--accent)}
.garden .field .val{font-family:var(--font-mono);font-size:12.5px}
.garden .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.garden .btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;min-height:34px}
.garden .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.garden .btn.danger{color:var(--bad)}
.garden .btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.garden .checks{font-size:13px;display:flex;flex-direction:column;gap:3px}
.garden .checks .ok{color:var(--ok)} .garden .checks .warn{color:var(--warn)} .garden .checks .bad{color:var(--bad)}
.garden table{font-size:13px}
.garden td,.garden th{padding:5px 6px}
.garden th{font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.garden td.n{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:left;white-space:normal}
.garden .tablewrap{overflow-x:auto}
.garden ul.tight{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.garden .note{border-left:3px solid var(--warn);padding:6px 10px;background:var(--bg);border-radius:0 8px 8px 0;font-size:13.5px;color:var(--text);margin:0}
.garden .assume{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:6px 10px;align-items:center;font-size:13.5px}
.garden .assume input{width:100%}
.garden .src{display:inline-block;font-size:11px;font-weight:700;padding:0 6px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.garden .src.m,.garden .src.v{color:var(--ok)} .garden .src.g{color:var(--warn)} .garden .src.p{color:var(--muted)}
.garden #stSec svg{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.garden #stSec text{font-family:var(--font-mono);font-size:.36px;fill:var(--fg)}
.gv[hidden]{display:none}
.gv .views{position:absolute;left:10px;right:10px;top:10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;z-index:2}
.gv .views::-webkit-scrollbar{display:none}
.gv .chip{flex:none;border:1px solid var(--line);background:var(--scrim);backdrop-filter:blur(6px);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13.5px;font-weight:600;white-space:nowrap;color:var(--text)}
.gv .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.gv .hud{position:absolute;left:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;max-width:min(360px,calc(100% - 20px));z-index:2}
.gv .card-float{background:var(--scrim);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;color:var(--text)}
.gv .sun{display:grid;grid-template-columns:auto minmax(0,1fr) 4.6em;align-items:center;gap:4px 8px;font-size:13px}
.gv .sun input{width:100%;accent-color:var(--accent)}
.gv .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.gv .legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.gv .legend i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
.gv .ghint{position:absolute;right:10px;bottom:10px;font-size:12.5px;color:var(--label-text);background:var(--label-bg);padding:5px 9px;border-radius:8px;max-width:230px;text-align:right;pointer-events:none}
.gv .toast{position:absolute;left:50%;top:56px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:6px 12px;border-radius:8px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .25s;z-index:3}
.gv .toast.show{opacity:1}
body.v-garten #hint{display:none}
@media (max-width:820px){
  .gv .ghint{display:none}
  .gv .hud{left:8px;right:8px;bottom:8px;max-width:none;gap:4px}
  .gv .card-float{padding:5px 8px}
  .gv .legend{font-size:11.5px;gap:2px 8px}
}
@media (prefers-reduced-motion: reduce){.garden .fill,.gv .toast{transition:none}}
</style>
</head>
<body>
<header id="hdr">
  <h1>Holzhaus mit Garten · 3D-Modell</h1>
  <div class="bar">
    <div class="grp" role="group" aria-label="Bereich">
      <button class="chip" data-k="unit" data-v="1">Wohnung 1</button>
      <button class="chip" data-k="unit" data-v="2">Wohnung 2</button>
      <button class="chip" data-k="unit" data-v="3">Wohnung 3</button>
      <button class="chip" data-k="view" data-v="garten">Garten</button></div>
    <div class="grp" role="group" aria-label="Etage">
      <button class="chip" data-k="lvl" data-v="EG">EG</button>
      <button class="chip" data-k="lvl" data-v="OG">OG</button>
      <button class="chip" data-k="lvl" data-v="DG">DG</button></div>
    <div class="grp"><button class="chip" id="furnBtn" aria-pressed="true" title="Beispielmöblierung ein/aus">Möbel</button>
      <button class="chip" id="extBtn" aria-pressed="true" title="Außenwände ein/aus, um besser in die Räume zu schauen">Außenwände</button></div>
    <div class="grp" role="group" aria-label="Ansicht"><span>Ansicht</span>
      <button class="chip" data-k="view" data-v="aussen">Außen</button>
      <button class="chip" data-k="view" data-v="puppe">Puppenhaus</button>
      <button class="chip" data-k="view" data-v="walk">Rundgang</button>
      <button class="chip" data-k="view" data-v="plan">Grundriss</button></div>
  </div>
</header>
<main>
  <div id="view">
    <canvas id="c"></canvas>
    <div id="labels"></div>
    <div id="plan"></div>
    <div id="mini"></div>
    <div id="walkbtns"><button id="bF" aria-label="vorwärts">▲</button><button id="bB" aria-label="rückwärts">▼</button></div>
    <div id="hint"><span id="hintTxt"></span></div>
  </div>
  <aside id="panel"></aside>
</main>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="garten/garten.js"></script>
<script>
(function(){
'use strict';
if(!window.THREE){document.getElementById('hintTxt').textContent='3D-Bibliothek konnte nicht geladen werden.';return;}

/* ================= Geometrie aus dem Werkplan (Meter) =================
   x: entlang Längsseite, 0 = Außenkante NW-Giebel
   y: entlang Giebel, 0 = Außenkante Gartenseite, 9,60 = Straßenseite
   z: Höhe, ±0 = FFB EG.   Wohnung 3 = Wohnung 2 gespiegelt (x' = 13,54 − x) */
const D2R=Math.PI/180, K=Math.tan(26*D2R);
const L=13.54, B=9.60, T=0.347, MID=L/2;
const Z_OG=2.78, Z_DG=5.54, H_OG=2.40, RIDGE=9.04, ROOF_T=0.68, YR=B/2;
// DG-Höhen nach Werkplan-Schnitt: Kniestock innen ≈ 0,65 m, First innen ≈ 2,82 m (DG_LIFT = Korrektur, falls gemessen)
const DG_LIFT=0;
const HR=RIDGE-ROOF_T-Z_DG+DG_LIFT;
const RT=0.36;                         // sichtbare Dachstärke außen
const CX0=3.455, CX1=L-CX0;            // Zwerchgiebel über Balkonen
const EAVE=1.40, GOV=1.55;             // Dachüberstand Traufe / Giebel (Giebel aus dem PV-Foto der Straßenseite abgeleitet: 2 × 7 Module + Mittelstreifen)
const LB_X0=4.10, LB_X1=12.6, LB_D=1.5;  // Laubengang Straßenseite (nach Fotos)
const BAL_D=2.55, BAL_S=0.98, SEP0=6.67, SEP1=6.87;
const RISE=(Z_DG-Z_OG)/15;
const zOut=y=>RIDGE-K*Math.abs(y-YR);
const zCross=x=>RIDGE-K*Math.abs(x-MID);
const inCross=x=>x>=CX0-1e-9&&x<=CX1+1e-9;
const hMain=y=>HR-K*Math.abs(y-YR);
const hCross=x=>inCross(x)?HR-K*Math.abs(x-MID):-9;
const hDG=(x,y)=>Math.max(hMain(y), y<=YR?hCross(x):-9);
const mx=x=>L-x;
const rect=(x0,y0,x1,y1)=>[[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
const STAIR_OPEN=[5.235,5.636,6.545,9.253];
const AD_AREA=94;                      // Wohnfläche laut Ausschreibung inkl. anteiligem Balkon

const HEAD={cross:(x,y)=>hCross(x)-0.10, roof:(x,y)=>hMain(y)-0.15};

/* ---------- Wohnung 2 (NW-Hälfte) ---------- */
const W2={
  intWalls:[
    {lvl:'OG',r:[3.327,5.723,3.517,9.253],op:[{a:5.823,b:6.833,s:0,h:2.01,k:'door'}]},
    {lvl:'OG',r:[T,5.533,6.545,5.723],op:[{a:4.095,b:5.105,s:0,h:2.01,k:'door'}]},
    {lvl:'OG',r:[5.205,3.653,6.545,3.843]},
    {lvl:'OG',r:[1.447,8.2,1.547,9.253]},
    {lvl:'OG',r:[5.205,3.843,5.395,5.533],op:[{a:4.70,b:5.45,s:0,h:2.01,k:'door'}]},
    {lvl:'DG',r:[T,4.705,1.157,4.895]},

/* ---------- Treppe (viertelgewendelt unten und oben) ---------- */
function wedge(P,th1,th2,R){
  const [xa,ya,xb,yb]=R;
  const hit=th=>{const c=Math.cos(th*D2R),s=Math.sin(th*D2R);let t=1e9;
    if(c>1e-9)t=Math.min(t,(xb-P[0])/c); if(s>1e-9)t=Math.min(t,(yb-P[1])/s); if(s<-1e-9)t=Math.min(t,(ya-P[1])/s);
    return [P[0]+c*t,P[1]+s*t];};
  const corners=[[xb,yb],[xb,ya],[xa,ya],[xa,yb]].map(p=>({p,a:Math.atan2(p[1]-P[1],p[0]-P[0])/D2R}))
     .filter(o=>o.a<th1-1e-6&&o.a>th2+1e-6&&Math.hypot(o.p[0]-P[0],o.p[1]-P[1])>1e-6).sort((a,b)=>b.a-a.a).map(o=>o.p);
  return [P,hit(th1),...corners,hit(th2)];
}
function stairTreads(){
  const X0=5.235,X1=6.545,Pb=[X0,7.943],Pt=[X0,7.033],out=[];let j=1;
  for(let i=0;i<5;i++,j++) out.push({poly:wedge(Pb,90-18*i,90-18*(i+1),[X0,7.943,X1,9.253]),z:Z_OG+j*RISE});
  const g=(7.943-7.033)/4;

  for(let i=0;i<5;i++,j++) out.push({poly:wedge(Pt,-18*i,-18*(i+1),[X0,5.723,X1,7.033]),z:Z_OG+j*RISE});
  return out;
}

/* ---------- PV-Anlage (Trina Vertex S+ 440 W, 1762 × 1134 × 30 mm, hochkant) ----------

      if(![[xc-PV.W/2,s0],[xc+PV.W/2,s0],[xc-PV.W/2,s1],[xc+PV.W/2,s1]].every(([x,s])=>ok(x,s)))continue;}

/* ---------- Geländer ---------- */
// boards: dicht gesetzte senkrechte Bretter (OG-Balkon, Laubengang) · lattice: Latten mit Abstand (DG) · steel: Treppe
const SLATS={};

function railing(grp,pts,z,h,kind,collide){
  kind=kind||'boards';const K_=RK[kind];const wood=K_.mat==='larch';
  const gname=Object.keys(G).find(k=>G[k]===grp);
  for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];
    beam(grp,[a[0],a[1],z+h],[b[0],b[1],z+h],wood?0.12:0.06,wood?0.06:0.05,wood?M.larch:M.tread);
    if(wood)beam(grp,[a[0],a[1],z+0.1],[b[0],b[1],z+0.1],0.06,0.05,M.larch);
    if(kind==='lattice')beam(grp,[a[0],a[1],z+h-0.16],[b[0],b[1],z+h-0.16],0.06,0.05,M.larch);
    const len=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.round(len/K_.sp)),ang=Math.atan2(b[1]-a[1],b[0]-a[0]);

    if(collide){const pad=0.04;COLL.push({x0:Math.min(a[0],b[0])-pad,x1:Math.max(a[0],b[0])+pad,y0:Math.min(a[1],b[1])-pad,y1:Math.max(a[1],b[1])+pad,z0:z,z1:z+h});}

function flushSlats(){

    const im=new THREE.InstancedMesh(BOXG,K_.mat==='larch'?M.larch:M.steel,arr.length);const m=new THREE.Matrix4(),q=new THREE.Quaternion(),s=new THREE.Vector3(),Y=new THREE.Vector3(0,1,0);

  // Deko auf einem Boden: Gläser, Flaschen, Pflanze

      for(let k=0;k<5;k++){cyl(g,xc+(k%2?0.09:-0.09),y-0.08+k*0.04,z-0.35-k*0.04,0.012,0.45+k*0.04,mat.leaf,6);}}

function walkStep(dt){
  let moving=false;const sp=(keys.has('shift')?3.0:1.5)*dt;
  let f=0,s=0,turn=0;
  if(keys.has('w')||keys.has('arrowup')||keys.has('bF'))f+=1;
  if(keys.has('s')||keys.has('arrowdown')||keys.has('bB'))f-=1;
  if(keys.has('a'))s+=1; if(keys.has('d'))s-=1;
  if(keys.has('arrowleft')||keys.has('q'))turn+=1; if(keys.has('arrowright')||keys.has('e'))turn-=1;
  if(turn){player.yaw+=turn*1.6*dt;moving=true;}
  if(f||s){player.target=null;const cy=Math.cos(player.yaw),sy=Math.sin(player.yaw);
    const n=Math.hypot(f,s);tryMove((cy*f-sy*s)/n*sp,(sy*f+cy*s)/n*sp);moving=true;}
  if(player.target){
    const tx=player.target[0]-player.x,ty=player.target[1]-player.y,dist=Math.hypot(tx,ty);
    if(dist<0.08){player.target=null;}
    else{const want=Math.atan2(ty,tx);let da=want-player.yaw;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;
      player.yaw+=da*Math.min(1,dt*5);
      const st=Math.min(dist,sp);const r=tryMove(tx/dist*st,ty/dist*st);
      if(r!==true){player.stuck+=dt;if(player.stuck>0.35){player.target=null;player.stuck=0;}}else player.stuck=0;
      moving=true;}
  }
  if(player.gTarget!==undefined&&Math.abs(player.gTarget-player.feet)>0.002){player.feet+=(player.gTarget-player.feet)*Math.min(1,dt*10);moving=true;}
  updateEye(Math.min(1,dt*8));
  const nl=lvlAt(player.feet);
  if(nl!==state.lvl){state.lvl=nl;if(nl==='EG')state.unit=1;else if(state.unit===1)state.unit=player.x<MID?2:3;syncChips();renderPanel();}
  applyWalkCam();
  return moving;
}

let pdown=null;
canvas.addEventListener('pointerdown',e=>{if(state.view!=='walk')return;pdown={x:e.clientX,y:e.clientY,t:performance.now(),moved:0,id:e.pointerId};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(state.view!=='walk'||!pdown||e.pointerId!==pdown.id)return;const dx=e.clientX-pdown.x,dy=e.clientY-pdown.y;pdown.moved+=Math.abs(dx)+Math.abs(dy);pdown.x=e.clientX;pdown.y=e.clientY;
  const k=e.pointerType==='touch'?0.006:0.004;player.yaw+=dx*k;player.pitch=Math.max(-1.25,Math.min(1.25,player.pitch-dy*k));applyWalkCam();requestRender();});
canvas.addEventListener('pointerup',e=>{if(state.view!=='walk'||!pdown)return;const tap=pdown.moved<8&&performance.now()-pdown.t<450;pdown=null;
  if(tap)tapGo(e);});
const ray=new THREE.Raycaster();
function tapGo(e){
  const rc=canvas.getBoundingClientRect();const v=new THREE.Vector2(((e.clientX-rc.left)/rc.width)*2-1,-((e.clientY-rc.top)/rc.height)*2+1);
  ray.setFromCamera(v,camera);
  const hits=ray.intersectObjects(scene.children,true).filter(h=>h.object.visible&&h.object.material!==M.glass&&h.object.material!==M.glassShower);
  if(!hits.length)return;
  const h=hits[0];if(PICK.indexOf(h.object)<0&&!(h.face&&h.face.normal&&Math.abs(h.face.normal.clone().transformDirection(h.object.matrixWorld).y)>0.9))return;
  const tx=h.point.x,ty=-h.point.z,tz=h.point.y;
  if(Math.abs(tz-player.feet)>0.6){const g=canStand(tx,ty,tz);if(g!==null){player.x=tx;player.y=ty;player.feet=player.gTarget=g;updateEye(1);}}
  else player.target=[tx,ty];
  requestRender();
}

window.addEventListener('keyup',e=>{keys.delete(keyName(e));});

/* ---------- Render-Schleife (nur bei Bedarf) ---------- */
let pending=false,lastT=0;
function requestRender(){if(!pending){pending=true;requestAnimationFrame(frame);}}
function frame(t){
  pending=false;const dt=Math.min(0.05,lastT?(t-lastT)/1000:0.016);lastT=t;
  let again=false;
  if(state.view==='walk')again=walkStep(dt);
  if(WZ.step(dt))again=true;
  if(KK.step(dt))again=true;
  if(GARTEN&&GARTEN.step(t))again=true;
  renderer.render(scene,camera);updateLabels();if(state.view==='walk')drawMini();
  if(again||keys.size)requestRender();else lastT=0;
}

const svgY=y=>B-y;
const ptsAttr=poly=>poly.map(([x,y])=>x.toFixed(3)+','+svgY(y).toFixed(3)).join(' ');
const pathD=(poly)=>'M'+poly.map(([x,y])=>x.toFixed(3)+' '+svgY(y).toFixed(3)).join('L')+'Z';
function wallPieces(w){
  const r=w.r,ax=axisOf(r),u0=ax==='x'?r[0]:r[1],u1=ax==='x'?r[2]:r[3];
  const ops=(w.op||[]).slice().sort((a,b)=>a.a-b.a);const segs=[];let cur=u0;ops.forEach(o=>{segs.push([cur,o.a]);cur=o.b;});segs.push([cur,u1]);
  const R=(a,b)=>ax==='x'?[a,r[1],b,r[3]]:[r[0],a,r[2],b];
  return {solid:segs.filter(s=>s[1]-s[0]>0.003).map(s=>R(...s)),ops:ops.map(o=>({o,r:R(o.a,o.b),ax}))};
}
function planSVG(unit,lvl,furn,mini){
  const u=UNITS[unit];
  const clipX=unit===1?[-0.6,L+0.6]:unit===2?[-1.2,6.995]:[6.545,L+1.2];
  const vb=[clipX[0]-0.3,-2.1,clipX[1]-clipX[0]+0.6,B+BAL_D+3.4];
  let s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="'+vb.join(' ')+'" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Grundriss Wohnung '+unit+' '+lvl+'">';
  s+='<defs><clipPath id="cp'+(mini?'m':'')+'"><rect x="'+clipX[0]+'" y="-3" width="'+(clipX[1]-clipX[0])+'" height="20"/></clipPath></defs>';
  s+='<g clip-path="url(#cp'+(mini?'m':'')+')" font-family="system-ui,sans-serif">';
  // Balkon
  const bal=u.rooms.find(r=>r.id===(lvl==='OG'?'balkonOG':'balkonDG'));
  if(bal)s+='<path d="'+pathD(bal.poly)+'" fill="var(--balc)" stroke="var(--muted)" stroke-width="0.03"/>';
  if(lvl==='DG'){const roofLn=[[unit===2?-0.3:MID,-BAL_D-0.3],[unit===2?MID:L+0.3,-BAL_D-0.3]];s+='<polyline points="'+ptsAttr(roofLn)+'" stroke="var(--muted)" stroke-width="0.02" stroke-dasharray="0.15 0.1" fill="none"/>';}
  if(lvl==='OG'){s+='<polygon points="'+ptsAttr(rect(LB_X0,B,LB_X1,B+LB_D))+'" fill="var(--balc)" stroke="var(--muted)" stroke-width="0.03"/>';
    for(let k=0;k<15;k++){const x=LB_X0-k*0.25;s+='<line x1="'+x+'" x2="'+x+'" y1="'+svgY(B+LB_D-1.0)+'" y2="'+svgY(B+LB_D)+'" stroke="var(--muted)" stroke-width="0.015"/>';}
    s+='<polyline points="'+ptsAttr([[LB_X0-3.5,B+LB_D-1.0],[LB_X0,B+LB_D-1.0],[LB_X0,B],[LB_X0,B+LB_D],[LB_X0-3.5,B+LB_D]])+'" fill="none" stroke="var(--muted)" stroke-width="0.02"/>';}
  // Räume
  u.rooms.filter(r=>r.lvl===lvl&&!r.f).forEach(r=>{let d=pathD(r.poly);(r.holes||[]).forEach(h=>d+=pathD(h));
    s+='<path d="'+d+'" fill-rule="evenodd" fill="'+(r.id==='bad'?'var(--room-wet)':'var(--room)')+'"/>';});
  // Treppe
  const tr=u.treads;
  if(lvl==='OG'){tr.forEach(t=>s+='<polygon points="'+ptsAttr(t.poly)+'" fill="none" stroke="var(--muted)" stroke-width="0.015"/>');}
  else if(lvl==='DG'){const op=unit===2?STAIR_OPEN:mRect(STAIR_OPEN);s+='<polygon points="'+ptsAttr(rect(...op))+'" fill="var(--bg)" stroke="var(--muted)" stroke-width="0.02" stroke-dasharray="0.08 0.06"/>';
    tr.forEach(t=>s+='<polygon points="'+ptsAttr(t.poly)+'" fill="none" stroke="var(--muted)" stroke-width="0.01" opacity="0.6"/>');}
  // Höhenlinien DG
  if(lvl==='DG'){
    const m=unit===2?(p=>p):(p=>mPoly(p).reverse());
    const y2=YR-(HR-2)/K,y1=YR-(HR-1)/K, x2=MID-(HR-2)/K;
    const lines=[[[T,y2],[x2,y2],[x2,T],'2,0 m'],[[T,y1],[CX0,y1],[CX0,T],'1,0 m'],[[T,B-y2],[6.545,B-y2],null,'2,0 m'],[[T,B-y1],[3.825,B-y1],null,'1,0 m']];
    lines.filter(l=>l[0][1]>T+0.05&&l[0][1]<B-T-0.05).forEach(l=>{const pts=m(l.slice(0,3).filter(Boolean));s+='<polyline points="'+ptsAttr(pts)+'" fill="none" stroke="var(--hl)" stroke-width="0.025" stroke-dasharray="0.18 0.1"/>';
      const p0=pts[0];s+='<text x="'+(p0[0]+(unit===2?0.08:-0.08))+'" y="'+(svgY(p0[1])-0.07)+'" font-size="0.2" fill="var(--hl)" text-anchor="'+(unit===2?'start':'end')+'">'+l[3]+'</text>';});
  }
  // Möbel
  const fl=(furn?u.furn:[]).concat(u.fixed).filter(f=>f.lvl===lvl);
  fl.forEach(f=>{const w=f.w||0.5,d=f.d||0.5;s+='<rect x="'+(-w/2)+'" y="'+(-d/2)+'" width="'+w+'" height="'+d+'" rx="0.04" transform="translate('+f.x+' '+svgY(f.y)+') rotate('+(-(f.rot||0))+')" fill="none" stroke="var(--furn)" stroke-width="0.025"/>';});
  // Geländer
  if(lvl==='OG'){s+='<polyline points="'+ptsAttr([[T,0],[T,-BAL_S],[CX0,-BAL_S],[CX0,-BAL_D],[CX1,-BAL_D],[CX1,-BAL_S],[L-T,-BAL_S],[L-T,0]])+'" fill="none" stroke="var(--wall)" stroke-width="0.05"/>';
    s+='<rect x="'+SEP0+'" y="'+svgY(0)+'" width="'+(SEP1-SEP0)+'" height="'+BAL_D+'" fill="var(--wall)"/>';}
  else if(lvl==='DG'){s+='<polyline points="'+ptsAttr([[CX0,0],[CX0,-BAL_D],[CX1,-BAL_D],[CX1,0]])+'" fill="none" stroke="var(--wall)" stroke-width="0.05"/>';
    s+='<rect x="'+SEP0+'" y="'+svgY(0)+'" width="'+(SEP1-SEP0)+'" height="'+BAL_D+'" fill="var(--wall)"/>';}
  // Wände
  if(lvl==='EG')s+=egPlanItems();
  WALLS.filter(w=>w.lvl===lvl).concat(lvl==='EG'?[egGardenSpec(WZ.ww())]:[]).forEach(w=>{const wp=wallPieces(w);
    wp.solid.forEach(r=>s+='<rect x="'+r[0]+'" y="'+svgY(r[3])+'" width="'+(r[2]-r[0]).toFixed(3)+'" height="'+(r[3]-r[1]).toFixed(3)+'" fill="var(--wall)"/>');
    wp.ops.forEach(({o,r,ax})=>{if(o.k==='door')return;
      const x=r[0],y=svgY(r[3]),ww=r[2]-r[0],hh=r[3]-r[1];
      if(o.k==='solid'){s+='<rect x="'+x+'" y="'+y+'" width="'+ww+'" height="'+hh+'" fill="var(--wall)" opacity="0.45"/>';return;}
      s+='<rect x="'+x+'" y="'+y+'" width="'+ww+'" height="'+hh+'" fill="var(--bg)" stroke="var(--wall)" stroke-width="0.012"/>';
      if(ax==='x')s+='<line x1="'+x+'" x2="'+(x+ww)+'" y1="'+(y+hh/2)+'" y2="'+(y+hh/2)+'" stroke="var(--win)" stroke-width="0.03"/>';
      else s+='<line y1="'+y+'" y2="'+(y+hh)+'" x1="'+(x+ww/2)+'" x2="'+(x+ww/2)+'" stroke="var(--win)" stroke-width="0.03"/>';});
  });
  // Beschriftung
  if(!mini){
    u.rooms.filter(r=>r.lvl===lvl).forEach(r=>{const[x,y]=r.lab;
      const fs=r.fs||0.26;s+='<text x="'+x+'" y="'+svgY(y)+'" font-size="'+fs+'" font-weight="600" fill="var(--text)" text-anchor="middle">'+r.name+'</text>';
      s+='<text x="'+x+'" y="'+(svgY(y)+0.32)+'" font-size="0.22" fill="var(--muted)" text-anchor="middle">'+fmt(r.wfl)+' m²'+(r.f?' (anteilig v. '+fmt(r.base)+')':'')+'</text>';});
    if(lvl==='OG'){const hx=unit===2?5.8:mx(4.17);s+='<text x="'+hx+'" y="'+(svgY(B+LB_D/2)+0.08)+'" font-size="0.22" fill="var(--muted)" text-anchor="middle">Laubengang</text>';
      if(unit===2)s+='<text x="'+(LB_X0-1.75)+'" y="'+(svgY(B+LB_D-0.5)+0.07)+'" font-size="0.18" fill="var(--muted)" text-anchor="middle">Außentreppe ↓</text>';}
  }
  s+='</g>';
  if(!mini){
    // Nordpfeil + Maßstab
    const nx=-0.559,ny=0.829, ax=unit===2?clipX[0]+0.45:clipX[1]-0.45, ay=-1.6;
    s+='<g transform="translate('+ax+' '+(ay+0.35)+')"><circle r="0.32" fill="var(--panel)" stroke="var(--muted)" stroke-width="0.02"/>'+
       '<line x1="'+(-nx*0.25)+'" y1="'+(ny*0.25)+'" x2="'+(nx*0.25)+'" y2="'+(-ny*0.25)+'" stroke="var(--text)" stroke-width="0.04"/>'+
       '<polygon points="'+(nx*0.3)+','+(-ny*0.3)+' '+(nx*0.12-ny*0.08)+','+(-ny*0.12-nx*0.08)+' '+(nx*0.12+ny*0.08)+','+(-ny*0.12+nx*0.08)+'" fill="var(--text)"/>'+
       '<text x="'+(nx*0.5)+'" y="'+(-ny*0.5+0.07)+'" font-size="0.2" text-anchor="middle" fill="var(--text)">N</text></g>';
    const sx=unit===2?clipX[1]-2.2:clipX[0]+0.2, sy=B+BAL_D+0.85;
    s+='<g><rect x="'+sx+'" y="'+sy+'" width="1" height="0.07" fill="var(--text)"/><rect x="'+(sx+1)+'" y="'+sy+'" width="1" height="0.07" fill="none" stroke="var(--text)" stroke-width="0.02"/>'+
       '<text x="'+sx+'" y="'+(sy+0.3)+'" font-size="0.18" fill="var(--muted)">0</text><text x="'+(sx+2)+'" y="'+(sy+0.3)+'" font-size="0.18" fill="var(--muted)" text-anchor="end">2 m</text></g>';
  } else {
    const pp=P(player.x,player.y,0);
    s+='<g transform="translate('+player.x+' '+svgY(player.y)+') rotate('+(-player.yaw/D2R)+')"><circle r="0.28" fill="var(--hl)"/><polygon points="0.75,0 0.2,0.32 0.2,-0.32" fill="var(--hl)" opacity="0.7"/></g>';
  }
  return s+'</svg>';

function egPlanItems(){
  let s='';const R=(x0,y0,x1,y1,rx,st)=>s+='<rect x="'+x0.toFixed(3)+'" y="'+svgY(y1).toFixed(3)+'" width="'+(x1-x0).toFixed(3)+'" height="'+(y1-y0).toFixed(3)+'" rx="'+(rx||0.02)+'" fill="'+(st?'var(--hl)':'none')+'" fill-opacity="0.18" stroke="'+(st?'var(--hl)':'var(--furn)')+'" stroke-width="0.025"/>';
  const K=KU,xf=K.gable-K.tallD;
  R(xf,T,K.gable,T+K.tallW);R(xf,K.wallN-K.tallW,K.gable,K.wallN);R(xf-0.02,T+K.tallW,K.gable,K.wallN-K.tallW);
  R(K.penX0,K.penY0,K.penX1,K.wallN);
  WZ.planRects().forEach(r=>R(r.x0,r.y0,r.x1,r.y1));
  const q=KK.geo();R(q.x0,q.yf,q.x1,q.yb,q.r,true);
  AR.planRects().forEach(r=>R(r.x0,r.y0,r.x1,r.y1,0.01,true));
  if(HS.st.v!=='aus'){const h=HS.geo();s+='<rect x="'+h.x0.toFixed(3)+'" y="'+svgY(h.y1).toFixed(3)+'" width="'+(h.x1-h.x0).toFixed(3)+'" height="'+(h.y1-h.y0).toFixed(3)+'" fill="none" stroke="var(--hl)" stroke-width="0.025" stroke-dasharray="0.1 0.06"/>';}
  s+='<text x="'+q.xc+'" y="'+(svgY(q.yf)+0.3)+'" font-size="0.16" fill="var(--hl)" text-anchor="middle">Kinderküche</text>';
  return s;
}

function setView(v,keepPlayer){
  if(v==='garten'&&!GARTEN)v='aussen';
  const was=state.view;
  if(v!=='garten')lastView=v;
  state.view=v;document.body.className='v-'+v;
  if(was==='garten'&&v!=='garten'){GARTEN.leave();controls.maxPolarAngle=Math.PI/2-0.04;controls.maxDistance=60;}
  if((was==='garten')!==(v==='garten'))renderPanel();
  const planEl=document.getElementById('plan');
  planEl.style.display=v==='plan'?'block':'none';
  canvas.style.visibility=v==='plan'?'hidden':'visible';
  controls.enabled=(v==='aussen'||v==='puppe'||v==='garten');
  document.getElementById('walkbtns').style.display=v==='walk'?'flex':'none';
  miniBox.style.display=v==='walk'?'block':'none';
  if(v==='walk'){camera.fov=70;camera.updateProjectionMatrix();
    if(!keepPlayer){if(was==='garten'&&GARTEN&&GARTEN.walkStart){const s0=GARTEN.walkStart();state.unit=1;state.lvl='EG';renderPanel();placePlayer(s0.x,s0.y,'EG',s0.look);}else{const r=startRoom();placePlayer(r.sp[0],r.sp[1],state.lvl,r.look);}}
    applyWalkCam();}
  else if(v==='garten'){controls.maxPolarAngle=Math.PI*0.88;controls.maxDistance=140;camera.fov=45;camera.updateProjectionMatrix();
    if(was!=='garten'||!keepPlayer)GARTEN.enter();}
  else if(v!=='plan')setCameraFor();
  if(v==='plan')planEl.innerHTML=planSVG(state.unit,state.lvl,state.furn,false);
  lblBox.innerHTML='';
  applyVisibility();syncChips();requestRender();
}
